<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Note — My Notes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #555; font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }
    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #aaa;
      margin-bottom: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 0.75rem;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #1a1a1a; }
    .footnote { font-size: 0.78rem; color: #aaa; margin-top: 1rem; }
    .footnote a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📝</div>
    <h1>Note shared with you</h1>
    <p class="subtitle">Someone shared a note using <strong>My Notes</strong>.<br>Open the app to view and collaborate.</p>

    <div class="card" id="app-card">
      <div class="card-label">Already have the app?</div>
      <a id="open-btn" class="btn btn-primary" href="#">Open in My Notes</a>
    </div>

    <div class="card" id="download-card">
      <div class="card-label">Don't have the app?</div>
      <a id="download-btn-macos" class="btn btn-secondary"
         href="https://github.com/armelatwork/notes-app/releases/download/v1.4.0/MyNotes-1.4.0.dmg"
         style="display:none">
        ⬇ Download for macOS (.dmg)
      </a>
      <a id="download-btn-android" class="btn btn-secondary"
         href="https://github.com/armelatwork/notes-app/releases/download/v1.4.0/app-release.apk"
         target="_blank" rel="noopener"
         style="display:none">
        ⬇ Download for Android (.apk)
      </a>
    </div>

    <p class="footnote">
      My Notes is a private, encrypted note-taking app.<br>
      <a href="https://thechaos-mynotes.web.app">Learn more</a>
    </p>
  </div>

  <script>
    const noteId = window.location.pathname.replace(/^\/note\/?/, '').replace(/\/$/, '');
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isMac = /Mac/i.test(navigator.userAgent) && !/iPhone|iPad/.test(navigator.userAgent);

    // ── "Open in app" button ──────────────────────────────────────────────────
    if (noteId) {
      const openBtn = document.getElementById('open-btn');
      if (isAndroid) {
        // Android intent URL: opens the app if installed, falls back to the APK.
        openBtn.href =
          'intent://note/' + noteId +
          '#Intent;scheme=https;host=thechaos-mynotes.web.app;' +
          'package=io.mynotes.app;' +
          'S.browser_fallback_url=https%3A%2F%2Fgithub.com%2Farmelatwork%2Fnotes-app%2Freleases%2Fdownload%2Fv1.4.0%2Fapp-release.apk;end';
      } else {
        // macOS: no Universal Links configured yet — hide the "open" card.
        document.getElementById('app-card').style.display = 'none';
      }
    }

    // ── Download button — show the right platform ─────────────────────────────
    if (isMac) {
      document.getElementById('download-btn-macos').style.display = 'inline-flex';
    } else {
      // Android and anything else (Windows, Linux, unknown) default to Android.
      document.getElementById('download-btn-android').style.display = 'inline-flex';
    }
  </script>
</body>
</html>
